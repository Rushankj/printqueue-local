<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PrintShop - Send to Print</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --green-bg: #dcfce7;
      --green-text: #166534;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 460px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 16px; }
    .shop-name { font-size: 1.4rem; font-weight: 800; margin: 0 0 6px; }
    .badge {
      display: inline-block; background: var(--green-bg); color: var(--green-text);
      font-size: 0.78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04); margin-bottom: 14px;
    }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .file-drop {
      border: 2px dashed #cbd5e1; border-radius: 12px; padding: 20px; text-align: center;
      background: #f8fafc; cursor: pointer; margin-bottom: 14px;
    }
    .file-drop input { display: none; }
    .file-info { font-size: 0.9rem; font-weight: 600; color: var(--primary); margin-top: 6px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .seg-group { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .seg-btn {
      flex: 1; padding: 10px 6px; border: none; background: #fff; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; color: var(--muted);
    }
    .seg-btn.active { background: var(--primary); color: #fff; }
    input[type="number"], input[type="text"] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 0.95rem;
    }
    .price-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #eff6ff; border-radius: 10px; padding: 10px 14px; margin: 12px 0;
      font-weight: 700; color: #1e40af;
    }
    .submit-btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--primary); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .token-box { text-align: center; padding: 24px 16px; }
    .token-num { font-size: 3.2rem; font-weight: 900; color: var(--primary); letter-spacing: 2px; margin: 8px 0; }
    .queue-pill {
      display: inline-block; background: #fef3c7; color: #92400e;
      padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 0.9rem;
    }
    .hidden { display: none; }
    .muted { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="shop-name" id="shopName">PrintShop</h1>
      <span class="badge">Local Wi-Fi &middot; Auto-deleted after print</span>
    </div>

    <div class="card" id="uploadCard">
      <div class="file-drop" onclick="document.getElementById('fileInput').click()">
        <div><strong>Tap to choose file</strong></div>
        <div class="muted">Supports PDF, JPG, PNG, DOCX</div>
        <div class="file-info" id="fileInfo"></div>
        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.docx" />
      </div>

      <div class="row">
        <div>
          <label>Color Mode</label>
          <div class="seg-group">
            <button type="button" class="seg-btn active" data-group="color" data-val="bw">B&amp;W</button>
            <button type="button" class="seg-btn" data-group="color" data-val="color">Color</button>
          </div>
        </div>
        <div>
          <label>Sides</label>
          <div class="seg-group">
            <button type="button" class="seg-btn active" data-group="duplex" data-val="single">1-Sided</button>
            <button type="button" class="seg-btn" data-group="duplex" data-val="duplex">2-Sided</button>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="pagesSpec">Pages (all or 1-3,5)</label>
          <input type="text" id="pagesSpec" value="all" placeholder="all or 1-4" />
        </div>
        <div>
          <label for="copiesInput">Copies</label>
          <input type="number" id="copiesInput" value="1" min="1" max="100" />
        </div>
      </div>

      <div class="price-bar">
        <span>Estimated Total</span>
        <span id="pricePreview">--</span>
      </div>

      <button class="submit-btn" id="submitBtn" disabled>Send to Print Queue</button>
    </div>

    <div class="card token-box hidden" id="statusCard">
      <div class="muted">Show this Token at the Counter</div>
      <div class="token-num" id="tokenDisplay">#---</div>
      <div class="queue-pill" id="queuePill">Waiting in queue...</div>
      <p class="muted" id="statusDetails" style="margin-top: 14px;"></p>
      <button class="submit-btn" style="margin-top: 12px; background: #475569;" onclick="resetForm()">Send Another File</button>
    </div>
  </div>

  <script>
    let shopInfo = { pricing: { bw_single: 2, bw_duplex: 1.5, color_single: 10, color_duplex: 9, currency: "₹" } };
    let selectedFile = null;
    let detectedPages = 1;
    let colorMode = "bw";
    let duplexMode = "single";
    let ws = null;

    async function loadInfo() {
      const res = await fetch("/api/info");
      shopInfo = await res.json();
      document.getElementById("shopName").textContent = shopInfo.shop_name;
    }

    function countSelectedPages(spec, total) {
      const cleaned = (spec || "all").trim().toLowerCase();
      if (!cleaned || cleaned === "all") return total;
      const set = new Set();
      for (const part of cleaned.split(",")) {
        const p = part.trim();
        if (p.includes("-")) {
          const [a, b] = p.split("-").map(x => parseInt(x.trim(), 10));
          if (!isNaN(a) && !isNaN(b)) {
            for (let i = Math.max(1, a); i <= Math.min(total, b); i++) set.add(i);
          }
        } else {
          const n = parseInt(p, 10);
          if (!isNaN(n) && n >= 1 && n <= total) set.add(n);
        }
      }
      return set.size || total;
    }

    function updatePrice() {
      if (!selectedFile) {
        document.getElementById("pricePreview").textContent = "--";
        return;
      }
      const pCount = countSelectedPages(document.getElementById("pagesSpec").value, detectedPages);
      const copies = Math.max(1, parseInt(document.getElementById("copiesInput").value || "1", 10));
      const pr = shopInfo.pricing;
      const rate = colorMode === "color"
        ? (duplexMode === "duplex" ? pr.color_duplex : pr.color_single)
        : (duplexMode === "duplex" ? pr.bw_duplex : pr.bw_single);
      const total = (pCount * copies * rate).toFixed(2).replace(/\.00$/, "");
      document.getElementById("pricePreview").textContent = `${pr.currency}${total} (${pCount}p × ${copies})`;
    }

    document.querySelectorAll(".seg-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const grp = btn.dataset.group;
        document.querySelectorAll(`.seg-btn[data-group="${grp}"]`).forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        if (grp === "color") colorMode = btn.dataset.val;
        if (grp === "duplex") duplexMode = btn.dataset.val;
        updatePrice();
      });
    });

    document.getElementById("pagesSpec").addEventListener("input", updatePrice);
    document.getElementById("copiesInput").addEventListener("input", updatePrice);

    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      document.getElementById("fileInfo").textContent = `${file.name} (Checking pages...)`;
      document.getElementById("submitBtn").disabled = false;

      const fd = new FormData();
      fd.append("file", file);
      try {
        const res = await fetch("/api/probe-pages", { method: "POST", body: fd });
        const data = await res.json();
        detectedPages = data.pages || 1;
        document.getElementById("fileInfo").textContent = `${file.name} · ${detectedPages} page(s)`;
      } catch {
        detectedPages = 1;
        document.getElementById("fileInfo").textContent = file.name;
      }
      updatePrice();
    });

    document.getElementById("submitBtn").addEventListener("click", async () => {
      if (!selectedFile) return;
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Uploading & Normalizing...";

      const fd = new FormData();
      fd.append("file", selectedFile);
      fd.append("color_mode", colorMode);
      fd.append("duplex_mode", duplexMode);
      fd.append("copies", document.getElementById("copiesInput").value || "1");
      fd.append("pages_spec", document.getElementById("pagesSpec").value || "all");

      try {
        const res = await fetch("/api/jobs", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Upload failed");
        showStatus(data);
        connectCustomerWs(data.job_id, data.customer_secret);
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = "Send to Print Queue";
      }
    });

    function showStatus(data) {
      document.getElementById("uploadCard").classList.add("hidden");
      document.getElementById("statusCard").classList.remove("hidden");
      renderJobUpdate(data);
    }

    function renderJobUpdate(data) {
      document.getElementById("tokenDisplay").textContent = `#${data.token}`;
      const pill = document.getElementById("queuePill");
      if (data.status === "pending") {
        pill.textContent = `Position #${data.queue_position} in queue · ~${data.estimated_wait_minutes} min wait`;
        pill.style.background = "#fef3c7"; pill.style.color = "#92400e";
      } else if (data.status === "printing") {
        pill.textContent = `Printing now on ${data.assigned_printer || "printer"}...`;
        pill.style.background = "#dbeafe"; pill.style.color = "#1e40af";
      } else if (data.status === "completed") {
        pill.textContent = "Ready! Collect your prints at the counter";
        pill.style.background = "#dcfce7"; pill.style.color = "#166534";
      } else {
        pill.textContent = `Status: ${data.status}`;
        pill.style.background = "#fee2e2"; pill.style.color = "#991b1b";
      }
      document.getElementById("statusDetails").textContent =
        `${data.filename} · ${data.selected_page_count}p × ${data.copies} · ${data.currency}${data.estimated_price}`;
    }

    function connectCustomerWs(jobId, secret) {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/customer/${jobId}?secret=${encodeURIComponent(secret)}`);
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "job_update") renderJobUpdate(msg);
      };
    }

    function resetForm() {
      if (ws) ws.close();
      selectedFile = null;
      document.getElementById("fileInput").value = "";
      document.getElementById("fileInfo").textContent = "";
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").textContent = "Send to Print Queue";
      document.getElementById("statusCard").classList.add("hidden");
      document.getElementById("uploadCard").classList.remove("hidden");
      updatePrice();
    }

    loadInfo();
  </script>
</body>
</html>
